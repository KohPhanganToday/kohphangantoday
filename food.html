var LANG="en", GRP="all", AREA=-1, OPEN=false;
var $=function(s){return document.querySelector(s);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function t(k){return T[LANG][k];}

/* The island runs on Bangkok time. A visitor reading this from Tel Aviv or
   Berlin must still see whether the kitchen is open there, not here. */
function islandNow(){
  var f=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Bangkok",weekday:"short",
    hour:"2-digit",minute:"2-digit",hour12:false});
  var p={}; f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  var days={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
  var h=parseInt(p.hour,10)%24;
  return {d:days[p.weekday], m:h*60+parseInt(p.minute,10)};
}
function mins(hhmm){var a=hhmm.split(":");return (+a[0])*60+(+a[1]);}
function fmt(hhmm){return hhmm;}

/* Returns null when we simply do not know the hours - that is different from
   knowing the place is shut, and the card says so differently. */
function status(it){
  if(it.d){
    var now=islandNow(), today=it.d[now.d];
    var yest=it.d[(now.d+6)%7];
    if(yest && yest!=="X" && yest!=="24"){
      var yp=yest.split("-"), ys=mins(yp[0]), ye=mins(yp[1]);
      if(ye<ys && now.m<ye) return {open:true, until:yp[1]};
    }
    if(today==="24") return {open:true, h24:true};
    if(!today||today==="X") return {open:false, shut:true};
    var p=today.split("-"), s=mins(p[0]), e=mins(p[1]);
    if(e<s){ if(now.m>=s) return {open:true, until:p[1]}; }
    else if(now.m>=s && now.m<e) return {open:true, until:p[1]};
    if(now.m<s) return {open:false, opens:p[0]};
    return {open:false, shut:true};
  }
  return null;
}
function hoursHtml(it){
  var st=status(it);
  if(st){
    if(st.h24) return '<p class="hours on">'+t("h24")+'</p>';
    if(st.open) return '<p class="hours on">'+t("open")+' <span class="sep">\u00b7</span> '
      +t("until")+' <time>'+esc(st.until)+'</time></p>';
    if(st.opens) return '<p class="hours off">'+t("closed")+' <span class="sep">\u00b7</span> '
      +t("opens")+'<time>'+esc(st.opens)+'</time></p>';
    return '<p class="hours off">'+t("closedtoday")+'</p>';
  }
  if(it.t){
    /* Hours the owners wrote themselves, in their own words and script. */
    var ltr=/[\u0590-\u05FF]/.test(it.t)?"":' dir="ltr"';
    return '<p class="hours off"'+ltr+'>'+esc(it.t)+'</p>';
  }
  return "";
}

function passes(it){
  if(GRP!=="all" && it.g!==GRP) return false;
  if(AREA>=0 && it.a!==AREA) return false;
  if(OPEN){ var st=status(it); if(!st||!st.open) return false; }
  return true;
}

function chips(){
  var counts={}, total=0;
  D.items.forEach(function(it){
    var keep=(AREA<0||it.a===AREA) && (!OPEN||(function(){var s=status(it);return s&&s.open;})());
    if(!keep) return;
    counts[it.g]=(counts[it.g]||0)+1; total++;
  });
  var h='<button class="chip" data-k="all" aria-pressed="'+(GRP==="all")+'">'
      +t("all")+' <em>'+total+'</em></button>';
  D.groups.forEach(function(g){
    h+='<button class="chip" data-k="'+g.k+'" aria-pressed="'+(GRP===g.k)+'">'
      +g.g+' '+esc(g[LANG])+' <em>'+(counts[g.k]||0)+'</em></button>';
  });
  $("#chips").innerHTML=h;
  $("#chips").querySelectorAll(".chip").forEach(function(b){
    b.onclick=function(){GRP=b.dataset.k;chips();render();};});
}

function areaBox(){
  var sel=$("#area");
  var h='<option value="-1">'+esc(t("allareas"))+'</option>';
  D.areas.forEach(function(a,i){
    var n=D.items.filter(function(it){return it.a===i;}).length;
    h+='<option value="'+i+'"'+(AREA===i?" selected":"")+'>'+esc(a[LANG])+' ('+n+')</option>';
  });
  sel.innerHTML=h;
  sel.onchange=function(){AREA=parseInt(sel.value,10);chips();render();};
}

function card(it){
  var r=(it.r!=null)
    ? '<span class="rate">\u2605 <b>'+esc(it.r.toFixed ? it.r.toFixed(1) : it.r)+'</b>'
      +(it.v?' <i>('+it.v.toLocaleString("en")+')</i>':'')+'</span>'
    : "";
  var kind='<span class="kind">'+esc(LANG==="he"?it.kh:it.ke)+'</span>';
  var area=(it.a!=null)?'<span class="sep">\u00b7</span><span class="kind">'
    +esc(D.areas[it.a][LANG])+'</span>':"";
  var own=it.c?'<span class="own">'+t("own")+'</span>':"";
  var links='<a href="'+esc(it.m)+'" target="_blank" rel="noopener noreferrer">'+t("map")+' \u2192</a>';
  if(it.p) links+='<a href="https://wa.me/'+esc(it.p)+'" target="_blank" rel="noopener noreferrer">'+t("wa")+'</a>';
  if(it.u) links+='<a href="'+esc(it.u)+'" target="_blank" rel="noopener noreferrer">'+t("site")+'</a>';
  return '<article class="card" id="'+esc(slug(it.n))+'"><h3>'+esc(it.n)+'</h3>'
    +'<div class="meta">'+r+kind+area+own+'</div>'
    +hoursHtml(it)
    +'<div class="links">'+links+'</div></article>';
}
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

function render(){
  var items=D.items.filter(passes);
  if(!items.length){
    $("#list").innerHTML='<p class="empty">'+esc(OPEN?t("noneopen"):t("none"))+'</p>';
    return;
  }
  var out=[];
  D.groups.forEach(function(g){
    if(GRP!=="all" && GRP!==g.k) return;
    var sub=items.filter(function(it){return it.g===g.k;});
    if(!sub.length) return;
    out.push('<section class="group"><h2>'+g.g+' '+esc(g[LANG])+' <b>'+sub.length+'</b></h2>'
      +'<div class="grid">'+sub.map(card).join("")+'</div></section>');
  });
  $("#list").innerHTML=out.join("");
}

function setLang(l,push){
  LANG=(l==="he")?"he":"en";
  var h=document.documentElement;
  h.lang=LANG; h.dir=(LANG==="he")?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var v=T[LANG][el.dataset.i18n]; if(v!=null) el.innerHTML=v;});
  $("#bEn").setAttribute("aria-pressed",LANG==="en");
  $("#bHe").setAttribute("aria-pressed",LANG==="he");
  $("#openNowLabel").textContent=t("openonly");
  document.title=(LANG==="he")
    ? "\u05d0\u05d9\u05e4\u05d4 \u05d0\u05d5\u05db\u05dc\u05d9\u05dd \u05d1\u05e7\u05d5\u05e4\u05e0\u05d2\u05df \u2014 Koh Phangan Today"
    : "Where to eat on Koh Phangan \u2014 Koh Phangan Today";
  areaBox(); chips(); render();
  try{localStorage.setItem("it_lang",LANG);}catch(e){}
  if(push){try{var u=new URL(location.href);u.searchParams.set("lang",LANG);
    history.replaceState(null,"",u);}catch(e){}}
}

$("#openNow").onclick=function(){
  OPEN=!OPEN;
  $("#openNow").setAttribute("aria-pressed",OPEN);
  chips(); render();
};

(function(){
  var l=null;
  try{l=new URL(location.href).searchParams.get("lang");}catch(e){}
  if(!l){try{l=localStorage.getItem("it_lang");}catch(e){}}
  if(!l && navigator.language && navigator.language.toLowerCase().indexOf("he")===0) l="he";
  setLang(l==="he"?"he":"en",0);
  var id=(location.hash||"").slice(1);
  if(id){var el=document.getElementById(id);
    if(el){try{el.scrollIntoView({block:"center"});}catch(e){el.scrollIntoView();}
      el.classList.add("hit");}}
})();

</script>
