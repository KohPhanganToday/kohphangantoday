<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; Koh Phangan Today</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A2C31">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A2C31'/%3E%3Ccircle cx='32' cy='26' r='11' fill='%23FFC247'/%3E%3Cpath d='M6 45c6-5 11-5 17 0s11 5 17 0 11-5 18 0' stroke='%2357D8C4' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Inter+Tight:wght@400;500&family=Rubik:wght@800&family=Assistant:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--sea:#0A2C31;--line:#1C4A50;--sand:#F1E6D2;--dim:#A8B8B4;--coral:#FF6B5A;--lagoon:#57D8C4;--mango:#FFC247;
  --display:"Bricolage Grotesque",sans-serif;--body:"Inter Tight",Arial,sans-serif}
html[lang="he"]{--display:"Rubik",sans-serif;--body:"Assistant",Arial,sans-serif}
html[lang="en"] .he{display:none!important}
html[lang="he"] .en{display:none!important}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sea);color:var(--sand);
  font-family:var(--body);display:grid;place-items:center;padding:28px;line-height:1.55}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(70% 45% at 80% 0,rgba(255,107,90,.16),transparent 60%),
             radial-gradient(60% 40% at 0 100%,rgba(87,216,196,.12),transparent 60%)}
.box{position:relative;max-width:540px;text-align:center}
svg.wave{width:96px;height:auto;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,8vw,64px);
  margin:0;letter-spacing:-.03em;line-height:1.02}
html[lang="he"] h1{letter-spacing:normal;line-height:1.12}
p{margin:16px auto 0;color:var(--dim);max-width:36ch}
.row{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a.btn{background:var(--coral);color:#180705;font-weight:600;padding:11px 20px;border-radius:9px;
  text-decoration:none;font-size:14.5px}
a.btn.ghost{background:none;border:1px solid var(--line);color:var(--sand);font-weight:500}
a.btn:hover{filter:brightness(1.08)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:26px}
.lang button{background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;
  padding:7px 12px;cursor:pointer;line-height:1}
.lang button[aria-pressed="true"]{background:var(--lagoon);color:#071F23;font-weight:600}
</style>
</head>
<body>
  <div class="box">
    <div class="lang" role="group" aria-label="Language / שפה">
      <button type="button" id="bEn" onclick="setLang('en',1)" aria-pressed="true">EN</button>
      <button type="button" id="bHe" onclick="setLang('he',1)" aria-pressed="false">&#1506;&#1489;</button>
    </div>
    <svg class="wave" viewBox="0 0 120 64" aria-hidden="true">
      <circle cx="60" cy="20" r="13" fill="#FFC247"/>
      <path d="M6 46c9-8 17-8 26 0s17 8 26 0 17-8 26 0 17 8 26 0" stroke="#57D8C4" stroke-width="5" fill="none" stroke-linecap="round"/>
    </svg>
    <h1><span class="en">Nothing here.</span><span class="he">אין כאן כלום.</span></h1>
    <p class="en">This page drifted off. The island, however, is still very much on.</p>
    <p class="he">הדף הזה נסחף. האי, לעומת זאת, עדיין פעיל לגמרי.</p>
    <div class="row en">
      <a class="btn" href="index.html">What's on today</a>
      <a class="btn ghost" href="food.html">Where to eat</a>
      <a class="btn ghost" href="guide.html">The island guide</a>
    </div>
    <div class="row he">
      <a class="btn" href="index.html">מה קורה היום</a>
      <a class="btn ghost" href="food.html">איפה אוכלים</a>
      <a class="btn ghost" href="guide.html">מדריך האי</a>
    </div>
  </div>
<script>
function setLang(l, push){
  var he = (l === "he");
  var h = document.documentElement;
  h.lang = he ? "he" : "en";
  h.dir  = he ? "rtl" : "ltr";
  document.getElementById("bEn").setAttribute("aria-pressed", String(!he));
  document.getElementById("bHe").setAttribute("aria-pressed", String(he));
  document.title = he ? "הדף לא נמצא — Koh Phangan Today"
                      : "Page not found — Koh Phangan Today";
  try{ localStorage.setItem("it_lang", h.lang); }catch(e){}
  if(push){ try{ var u = new URL(location.href); u.searchParams.set("lang", h.lang);
                 history.replaceState(null, "", u); }catch(e){} }
}
(function(){
  var l = null;
  try{ l = new URL(location.href).searchParams.get("lang"); }catch(e){}
  if(!l){ try{ l = localStorage.getItem("it_lang"); }catch(e){} }
  if(!l && navigator.language && navigator.language.toLowerCase().indexOf("he") === 0) l = "he";
  setLang(l === "he" ? "he" : "en", 0);
})();
</script>

</body>
</html>
