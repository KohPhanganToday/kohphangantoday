const T={"en": {"a11y.skip": "Skip to the list", "nav.today": "What's on today", "h1": "Places on the island.", "lede": "Yoga, Muay Thai, markets, cafes, dive shops and everything else that runs here — with the hours the owners gave us.", "stamp": "Checked in September 2026. Hours on this island change with the season and the weather — if you are making a trip for something, message the place first.", "cb.h": "Running something on Koh Phangan?", "cb.p": "Listing is free. Send us your classes, workshops or events and they go on the site and into the daily list.", "cb.b": "Add your place — free", "all": "Everything", "nolink": "Ask us for details", "go": "Visit site", "f.1": "© 2026 Koh Phangan Today · <a href='index.html'>What's on today</a> · <a href='guide.html'>The island guide</a> · <a href='legal.html'>Privacy &amp; terms</a>"}, "he": {"a11y.skip": "דילוג לרשימה", "nav.today": "מה קורה היום", "h1": "המקומות שבאי.", "lede": "יוגה, מוי תאי, שווקים, בתי קפה, בתי צלילה וכל השאר שפועל כאן — עם השעות שקיבלנו מהבעלים.", "stamp": "נבדק בספטמבר 2026. שעות באי הזה משתנות לפי העונה ומזג האוויר — אם אתם נוסעים במיוחד, תשלחו הודעה קודם.", "cb.h": "מריצים משהו בקופנגן?", "cb.p": "הפרסום בחינם. שלחו לנו שיעורים, סדנאות או אירועים והם יעלו לאתר ולרשימה היומית.", "cb.b": "להוסיף את המקום שלכם — בחינם", "all": "הכול", "nolink": "פנו אלינו לפרטים", "go": "לאתר", "f.1": "© 2026 Koh Phangan Today · <a href='index.html'>מה קורה היום</a> · <a href='guide.html'>מדריך האי</a> · <a href='legal.html'>פרטיות ותנאים</a>"}};
let LANG="en", FILTER="all";
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function t(k){return T[LANG][k];}
// Only whole-string phrases are translated. Translating single words inside an
// English sentence turns RTL layout into nonsense, so mixed text stays English.
var PHRASE={"booking required":"\u05d1\u05d4\u05d6\u05de\u05e0\u05d4 \u05de\u05e8\u05d0\u05e9",
            "open every day":"\u05e4\u05ea\u05d5\u05d7 \u05db\u05dc \u05d9\u05d5\u05dd",
            "open daily":"\u05e4\u05ea\u05d5\u05d7 \u05db\u05dc \u05d9\u05d5\u05dd"};
function hrs(s){
  if(LANG!=="he"||!s) return s;
  var k=s.trim().toLowerCase().replace(/[.\u00b7]+$/,"");
  return PHRASE[k] || s;
}

function chips(){
  var counts={}; PLACES.forEach(function(p){counts[p.c]=(counts[p.c]||0)+1;});
  var h='<button class="chip" data-k="all" aria-pressed="'+(FILTER==="all")+'">'
      + t("all")+' <em>'+PLACES.length+'</em></button>';
  CATS.forEach(function(c){ if(!counts[c.k]) return;
    h+='<button class="chip" data-k="'+c.k+'" aria-pressed="'+(FILTER===c.k)+'">'
      + c.g+' '+esc(c[LANG])+' <em>'+counts[c.k]+'</em></button>'; });
  $("#chips").innerHTML=h;
  $("#chips").querySelectorAll(".chip").forEach(function(b){
    b.onclick=function(){FILTER=b.dataset.k;chips();render();};});
}

function render(){
  var out=[];
  CATS.forEach(function(c){
    if(FILTER!=="all" && FILTER!==c.k) return;
    var items=PLACES.filter(function(p){return p.c===c.k;});
    if(!items.length) return;
    out.push('<section class="group"><h2>'+c.g+' '+esc(c[LANG])+' <b>'+items.length+'</b></h2><div class="grid">'
      + items.map(function(p){
          var hv=hrs(p.h);
          // English hours inside an RTL page must keep their own direction,
          // or the times and day ranges come out scrambled.
          var hd=/[\u0590-\u05FF]/.test(hv)?'':' dir="ltr"';
          var ht=p.h?'<p'+hd+'>'+esc(hv)+'</p>':'<p></p>';
          var link=p.u
            ? '<a class="go" href="'+esc(p.u)+'" target="_blank" rel="noopener noreferrer">'+t("go")+' &rarr;</a>'
            : '<span class="nolink">'+t("nolink")+'</span>';
          return '<article class="card"><h3>'+esc(p.n)+'</h3>'+ht+link+'</article>';
        }).join("")
      + '</div></section>');
  });
  $("#list").innerHTML=out.join("") || '<p class="empty">&mdash;</p>';
}

function setLang(l,push){
  LANG=(l==="he")?"he":"en";
  var h=document.documentElement;
  h.lang=LANG; h.dir=(LANG==="he")?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var v=T[LANG][el.dataset.i18n]; if(v!=null) el.innerHTML=v;});
  $("#bEn").setAttribute("aria-pressed",LANG==="en");
  $("#bHe").setAttribute("aria-pressed",LANG==="he");
  document.title=(LANG==="he")
    ? "\u05de\u05e7\u05d5\u05de\u05d5\u05ea \u05d1\u05e7\u05d5\u05e4\u05e0\u05d2\u05df \u2014 Koh Phangan Today"
    : "Places on Koh Phangan \u2014 Koh Phangan Today";
  chips(); render();
  try{localStorage.setItem("it_lang",LANG);}catch(e){}
  if(push){try{var u=new URL(location.href);u.searchParams.set("lang",LANG);
    history.replaceState(null,"",u);}catch(e){}}
}

(function(){
  var l=null;
  try{l=new URL(location.href).searchParams.get("lang");}catch(e){}
  if(!l){try{l=localStorage.getItem("it_lang");}catch(e){}}
  if(!l && navigator.language && navigator.language.toLowerCase().indexOf("he")===0) l="he";
  setLang(l==="he"?"he":"en",0);
})();
</script>
